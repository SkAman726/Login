<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="register.css" />
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"/>
  </head>
  <body>
    <form action="#">
      <div class="reg">
        <div class="header">
          <h2>Register</h2>
        </div>
        <input type="text" placeholder="Name" class="name" required />
        <input type="email" placeholder="Email" class="mail" required />
        <input type="password" placeholder="Password" class="pass" required />
        <input type="password" placeholder="Confirm Password" class="conpass" required />
        <input type="tel" placeholder="Phone Number" class="tel" required />
        <p><a href="index.html" target="_blank">already a member?</a></p>
        <input type="submit" value="Register" class="submit" /> <br />
        <i class="fa-brands fa-facebook face"></i>
        <i class="fa-brands fa-google google"></i>
      </div>
    </form>
  </body>
</html>
