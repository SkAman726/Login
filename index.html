<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <form action="#">
      <div class="container">
        <div class="header">
          <h2>Sign In</h2>
        </div>
        <input type="email" placeholder="Enter your email" class="user" required />
        <input type="password" placeholder="Enter your password" class="pass" required />
        <p><a href="#">Forgot Password?</a> <a href="register.html" target="_blank">Register Now</a></p>
        <input type="submit" value="SIGN IN" class="btn"/> <br />
        <i class="fa-brands fa-facebook face"></i>
        <i class="fa-brands fa-google google"></i>
      </div>
    </form>
  </body>
</html>
